name: Verify LIX Analog Guidance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-lix-analog.yml"

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record exact production run status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: e993876c71ef60880171b242bef708714c600cf6
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --workflow run-lix-analog.yml \
            --event workflow_dispatch \
            --commit "$TARGET_SHA" \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$run_id" ]; then
            printf '{"status":"run-not-found","headSha":"%s"}\n' "$TARGET_SHA" > .github/lix-analog-verify.json
          else
            gh run view "$run_id" \
              --json databaseId,status,conclusion,createdAt,updatedAt,url,headSha,event,workflowName \
              > .github/lix-analog-verify.json
          fi

          cat .github/lix-analog-verify.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/lix-analog-verify.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Probe preceding full analog run status"
          git push origin HEAD:main
