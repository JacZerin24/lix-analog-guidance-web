name: Verify LIX Analog Guidance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-lix-analog.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect RRFS downloader and candidate S3 paths
        run: |
          set -euo pipefail
          curl -L -o lix_bundle.zip \
            "https://github.com/JacZerin24/lix-analog-guidance-web/releases/download/data-v1/lix_github_actions_full_bundle.zip"
          unzip -q lix_bundle.zip -d runner

          {
            echo "=== Relevant original downloader source ==="
            grep -nEi 'rrfs_public|noaa-rrfs|bucket|s3|key|url|prefix' runner/scripts/05_download_rrfs_refs.py || true
            echo
            echo "=== Candidate object HEAD checks ==="
            for url in \
              "https://noaa-rrfs-ops-pds.s3.amazonaws.com/rrfs/v1.0/rrfs.20260818/12/rrfs.t12z.prslev.3km.f000.conus.grib2" \
              "https://noaa-rrfs-ops-pds.s3.amazonaws.com/rrfs.20260818/12/rrfs.t12z.prslev.3km.f000.conus.grib2" \
              "https://noaa-rrfs-pds.s3.amazonaws.com/rrfs/v1.0/rrfs.20260818/12/rrfs.t12z.prslev.3km.f000.conus.grib2" \
              "https://noaa-rrfs-pds.s3.amazonaws.com/rrfs_public/rrfs.20260818/12/rrfs.t12z.prslev.3km.f000.conus.grib2"
            do
              code=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 -I "$url" || true)
              echo "$code $url"
            done
          } > .github/rrfs-debug.txt

          cat .github/rrfs-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/rrfs-debug.txt
          git commit -m "Record RRFS S3 path diagnostics"
          git push origin HEAD:main
